plugins {
    id 'java'
}

group = 'com.ellanstudio'
version = '1.0.3'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    def paperApiVersion = providers.gradleProperty('paperApiVersion').orElse('26.3.build.157-beta').get()

    compileOnly "io.papermc.paper:paper-api:${paperApiVersion}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.named('jar') {
    archiveBaseName = 'EllanItemMergeGuard'
}
